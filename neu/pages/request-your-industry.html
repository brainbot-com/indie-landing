<section class="acc-chapter acc-chapter--white" id="industry"><div class="container"><div class="acc-chapter__text acc-chapter__text--wide" data-animate="fade-up"><h2 class="section-title">Want an AI Brain for your industry?</h2><p class="acc-sub">Tell us what you need it for. We will get in touch to learn about your requirements and see how we can set one up for you and your team.</p></div><div class="tf__wrap tf__wrap--single"><div class="tf__card"><form class="tf" data-trial-form data-type="industry" data-subject="Industry request" novalidate><label class="tf__hp" aria-hidden="true">Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label><div class="tf__grid"><label class="tf__field"><span class="tf__label">Your name <span class="tf__req" aria-hidden="true">*</span></span><input class="tf__input" type="text" name="name" required autocomplete="name"></label><label class="tf__field"><span class="tf__label">Company <span class="tf__req" aria-hidden="true">*</span></span><input class="tf__input" type="text" name="company" required autocomplete="organization"></label><label class="tf__field"><span class="tf__label">Work email <span class="tf__req" aria-hidden="true">*</span></span><input class="tf__input" type="email" name="email" required autocomplete="email"></label><label class="tf__field"><span class="tf__label">Phone</span><input class="tf__input" type="tel" name="phone" autocomplete="tel"></label><label class="tf__field"><span class="tf__label">Your role</span><select class="tf__input" name="role"><option value="" disabled selected>Choose</option><option>Managing director or owner</option><option>IT</option><option>Department lead</option><option>Other</option></select></label><label class="tf__field"><span class="tf__label">Your industry <span class="tf__req" aria-hidden="true">*</span></span><input class="tf__input" type="text" name="industry" required></label><label class="tf__field"><span class="tf__label">Company size <span class="tf__req" aria-hidden="true">*</span></span><select class="tf__input" name="team" required><option value="" disabled selected>Choose</option><option>Under 50 employees</option><option>50 to 250</option><option>250 to 1,000</option><option>Over 1,000</option></select></label><label class="tf__field"><span class="tf__label">When would you like to start?</span><select class="tf__input" name="start"><option value="" disabled selected>Choose</option><option>Now</option><option>In 3 months</option><option>This year</option><option>Just exploring</option></select></label><label class="tf__field"><span class="tf__label">Country</span><input class="tf__input" type="text" name="country" autocomplete="country-name"></label><label class="tf__field"><span class="tf__label">How did you hear about us?</span><select class="tf__input" name="source"><option value="" disabled selected>Choose</option><option>Referral</option><option>Webinar</option><option>KI am Werk</option><option>Search</option><option>LinkedIn</option><option>Other</option></select></label><label class="tf__field tf__field--full"><span class="tf__label">What do you need it for? <span class="tf__req" aria-hidden="true">*</span></span><textarea class="tf__input tf__area" name="message" rows="4" required></textarea></label></div><label class="tf__consent"><input type="checkbox" name="consent" required> <span>I agree that brainbot may contact me about this request. <a href="@@ROOT@@en/legal/privacy/">Privacy policy</a></span></label><p class="tf__error" role="alert" hidden>Please fill in the fields marked with an asterisk.</p><button class="btn btn--filled btn--xl btn--hero-cta tf__submit" type="submit"><span class="btn__label">Send request <span class="arrow">→</span></span></button></form><div class="tf__done" hidden><h3 class="tf__done-h">Thank you.</h3><p>We will be in touch soon.</p></div></div></div></div></section>
