<section class="acc-chapter acc-chapter--white" id="talk"><div class="container"><div class="acc-chapter__text acc-chapter__text--wide" data-animate="fade-up"><h2 class="section-title">Talk to us.</h2><p class="acc-sub">Ask us anything about the AI Brain, the devices or pricing, and we'll get back to you.</p></div><div class="tf__wrap"><div class="tf__card"><form class="tf" data-trial-form data-type="contact" data-subject="Question" novalidate><label class="tf__hp" aria-hidden="true">Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label><div class="tf__grid"><label class="tf__field"><span class="tf__label">Your name <span class="tf__req" aria-hidden="true">*</span></span><input class="tf__input" type="text" name="name" required autocomplete="name"></label><label class="tf__field"><span class="tf__label">Company</span><input class="tf__input" type="text" name="company" autocomplete="organization"></label><label class="tf__field"><span class="tf__label">Work email <span class="tf__req" aria-hidden="true">*</span></span><input class="tf__input" type="email" name="email" required autocomplete="email"></label><label class="tf__field"><span class="tf__label">Phone</span><input class="tf__input" type="tel" name="phone" autocomplete="tel"></label><label class="tf__field tf__field--full"><span class="tf__label">What would you like to know? <span class="tf__req" aria-hidden="true">*</span></span><textarea class="tf__input tf__area" name="message" rows="5" required></textarea></label></div><label class="tf__consent"><input type="checkbox" name="consent" required> <span>I agree that brainbot GmbH, the company behind indie.solutions, may use these details to answer my question. See our <a href="@@ROOT@@en/legal/privacy/">privacy policy</a>.</span></label><p class="tf__error" role="alert" hidden>Please fill in the fields marked with an asterisk.</p><button class="btn btn--filled btn--xl btn--hero-cta tf__submit" type="submit"><span class="btn__label">Send <span class="arrow">→</span></span></button></form><div class="tf__done" hidden><h3 class="tf__done-h">Thank you.</h3><p>We have your message, and someone from the brainbot team will get back to you.</p></div></div><div class="tf__side"><p class="tf__side-h">Prefer email?</p><p class="tf__sd">Write to us at <a href="mailto:contact@brainbot.com">contact@brainbot.com</a>.</p></div></div></div></section>
