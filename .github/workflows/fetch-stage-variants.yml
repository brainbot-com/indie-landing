name: fetch-stage-variants
on:
  push:
    branches: [claude/indiesolutions-design-concept-lhacvm]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 4K stage and clean up
        run: |
          curl -fsSL -o assets/indie-solutions/backgrounds/stage-b2-4k.png "https://d8j0ntlcm91z4.cloudfront.net/user_35jFUjZSPM83Kuji0Bw3Z0wSYDn/hf_20260818_065606_f9a7ba5d-7995-4e74-8e93-1679fd54b955.png"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/indie-solutions/backgrounds/stage-b2-4k.png
          git rm -q assets/indie-solutions/backgrounds/stage-b1.png assets/indie-solutions/backgrounds/stage-b2.png
          git rm -q .github/workflows/fetch-stage-variants.yml
          git commit -m "assets: Buehne B2 in 4K; Roh-Kandidaten und CI-Helfer entfernt"
          git push
