name: Fetch hero assets (temporaer)

on:
  push:
    branches: [claude/indiesolutions-design-concept-lhacvm]

permissions:
  contents: write

concurrency:
  group: fetch-hero-assets
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/indiesolutions-design-concept-lhacvm

      - name: Skip if already fetched
        id: check
        run: |
          if [ -f assets/indie-solutions/backgrounds/stage-4k.png ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download 4k stage
        if: steps.check.outputs.done == 'false'
        run: |
          curl -fsSL -o assets/indie-solutions/backgrounds/stage-4k.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_35jFUjZSPM83Kuji0Bw3Z0wSYDn/hf_20260818_064437_3f761b11-b82c-41d7-ba15-7b113d6c357f.png"

      - name: Commit
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/indie-solutions/backgrounds/stage-4k.png
          git commit -m "assets: Hero-Buehne in 4K (Upscale)"
          git push origin claude/indiesolutions-design-concept-lhacvm
