name: Fetch hero assets (temporaer)

# Einmal-Helfer: laedt zwei generierte Hero-Hintergruende von Higgsfield/CloudFront
# und committet sie auf diesen Branch. Wird nach Erfolg wieder entfernt.

on:
  push:
    branches: [claude/indiesolutions-design-concept-lhacvm]

permissions:
  contents: write

concurrency:
  group: fetch-hero-assets
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/indiesolutions-design-concept-lhacvm

      - name: Skip if already fetched
        id: check
        run: |
          if [ -f assets/indie-solutions/backgrounds/stage-v1.png ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download
        if: steps.check.outputs.done == 'false'
        run: |
          curl -fsSL -o assets/indie-solutions/backgrounds/stage-v1.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_35jFUjZSPM83Kuji0Bw3Z0wSYDn/hf_20260818_064047_9d616040-fe2f-46f1-abd0-468c2ffcead7.png"
          curl -fsSL -o assets/indie-solutions/backgrounds/stage-v2.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_35jFUjZSPM83Kuji0Bw3Z0wSYDn/hf_20260818_064047_8d840a6d-120c-4f85-9edc-600f632fee6d.png"
          file assets/indie-solutions/backgrounds/stage-v*.png

      - name: Commit
        if: steps.check.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/indie-solutions/backgrounds/stage-v1.png assets/indie-solutions/backgrounds/stage-v2.png
          git commit -m "assets: generierte Hero-Buehnen-Kandidaten (stage-v1, stage-v2)"
          git push origin claude/indiesolutions-design-concept-lhacvm
